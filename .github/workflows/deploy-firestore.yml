name: Deploy Firestore Rules & Indexes

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'

jobs:
  deploy-firestore:
    name: Deploy Firestore to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Firestore Rules and Indexes
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: eme-de-la-cu
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        continue-on-error: true

      - name: Deploy via Firebase CLI (fallback)
        if: always()
        run: |
          npm install -g firebase-tools
          npx firebase deploy --only firestore --project eme-de-la-cu --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
        continue-on-error: true
